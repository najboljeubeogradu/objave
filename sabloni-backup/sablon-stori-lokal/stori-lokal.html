<!doctype html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=430">
<link rel="stylesheet" href="/fonts/neometric-alt.css">
<link rel="stylesheet" href="/styles/post-shared.css">
<link rel="stylesheet" href="/styles/post-mobile.css">
<link rel="stylesheet" href="/styles/post-desktop.css">
<link rel="stylesheet" href="/styles/site-header-mobile.css">
<link rel="stylesheet" href="/styles/aurora.css">
<style>
  .m-h1wrap{display:block;font:inherit;letter-spacing:inherit;color:inherit}
  .m-h1{display:block}
  html,body{margin:0;padding:0;background:#0C0E12;overflow:hidden}
  #stage{position:relative;width:430px;height:765px;overflow:hidden;background:#0C0E12}
  /* zivа Aurora: isti slojevi kao --aurora (mobilni), svaki sjaj na svom sloju */
  .bg{position:absolute;inset:0;background:linear-gradient(180deg,#0B1016 0%,#0C0E12 60%,#0A0D12 100%)}
  .glow{position:absolute;left:-80px;top:-80px;width:590px;height:925px;will-change:transform}
  .g1{background:radial-gradient(420px 320px at 123px 110.6px, rgba(0,174,239,0.22), transparent 70%)}
  .g2{background:radial-gradient(360px 360px at 510px 386px, rgba(63,196,255,0.13), transparent 70%)}
  .g3{background:radial-gradient(520px 340px at 252px 860px, rgba(0,137,198,0.20), transparent 70%)}
  .g4{background:radial-gradient(300px 240px at 338px 501px, rgba(0,174,239,0.06), transparent 70%)}
  #stage .slide{position:absolute;inset:0;margin:0;opacity:1!important;width:430px;height:765px;min-height:0;overflow:visible;background:none!important;opacity:0}
  .stk{position:absolute;filter:drop-shadow(0 12px 20px rgba(0,0,0,.55)) drop-shadow(0 0 28px rgba(0,174,239,.20));will-change:transform}
  .safe{position:absolute;left:24px;right:24px;top:100px;bottom:136px}
  .slide .m-ratehero,.slide .m-statring{padding-left:0;padding-right:0}
  .ch{display:inline-block;white-space:pre;will-change:transform,filter,opacity}
  .w{white-space:nowrap}
  .hl{color:var(--blue)}
  /* logo kao nalepnica: kartica sa sajta (--card) + bela ivica kao na stikeru jela */
  .logostk{display:inline-block;margin-top:14px;padding:8px 13px 9px;background:var(--card);border:4px solid #fff;border-radius:16px;
    box-shadow:0 10px 20px rgba(0,0,0,.55),0 0 24px rgba(0,174,239,.20);transform-origin:50% 50%;will-change:transform}
  /* citljiviji natpisi (sajt: 12px/600); ovde vece i 700, svetlija siva */
  #k2 .dm-vres__cap{font-size:17px;font-weight:700;color:#C3C8CF;max-width:200px;line-height:1.35}
  #k2 .dm-ring__cap{font-size:21px;font-weight:700;color:#C3C8CF;max-width:240px;line-height:1.35}

  /* POZADINA opcija 2 (CONFIG.pozadina = 'pink'): menja se samo pozadina, svi elementi ostaju isti */
  html.pz-pink,html.pz-pink body,html.pz-pink #stage{background:#B8005F}
  html.pz-pink .bg{background:linear-gradient(180deg,#C8076B 0%,#B0005C 60%,#98004F 100%)}
  html.pz-pink .g1{background:radial-gradient(420px 320px at 123px 110.6px, rgba(255,120,190,0.45), transparent 70%)}
  html.pz-pink .g2{background:radial-gradient(360px 360px at 510px 386px, rgba(255,90,170,0.30), transparent 70%)}
  html.pz-pink .g3{background:radial-gradient(520px 340px at 252px 860px, rgba(90,0,45,0.45), transparent 70%)}
  html.pz-pink .g4{background:radial-gradient(300px 240px at 338px 501px, rgba(255,150,200,0.12), transparent 70%)}
</style></head>
<body>
<div id="stage">
  <div class="bg"></div>
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="glow g4"></div>

  <!-- KADAR 1 -->
  <div class="nb dm-root m-root slide" id="k1">
    <div class="safe">
      <h1 class="m-h1wrap"><span class="m-h1 split" style="font-size:45px;line-height:1.1;letter-spacing:0.01em;text-align:center;transform:translateY(32px) rotate(-5deg);transform-origin:50% 50%"><span id="q1"></span></span></h1>
    </div>
  </div>

  <!-- KADAR 2 -->
  <div class="nb dm-root m-root slide" id="k2">
    <div class="safe" style="display:flex;flex-direction:column;justify-content:center;top:100px;bottom:222px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(18px) rotate(-5deg);transform-origin:50% 50%;margin-left:8px">
          <h1 class="m-h1wrap"><span class="m-h1 split" style="font-size:51.7px;line-height:1.1;letter-spacing:0.01em"><span>trenutne<br><span class="hl">ocene</span><br>na sajtu</span></span></h1>
          <div id="logostk" class="logostk"><span class="shm-logo split" style="font-size:17.5px;white-space:nowrap">najbolje<b>u</b>beogradu<b>.</b>rs</span></div>
        </div>
        <div id="s2ph" style="width:134px;height:123px;flex:0 0 auto"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:26px;margin-right:34px">
        <div style="width:160px;display:flex;justify-content:center">
        <section id="rh" style="padding:0;flex:0 0 auto">
          <!-- isto kao [data-dm-rate-result] u PostBrisket.astro; broj se upisuje kao u post-brisket-desktop.js: `${score.toFixed(1)}<i>/5</i>` -->
          <div class="dm-vres" style="animation:none;zoom:.78">
            <span class="dm-vres__num"><span id="rnum">0.0</span><i>/5</i></span>
            <span class="dm-vres__cap">Prosečna ocena gostiju</span>
          </div>
        </section>
        </div>
        <div style="width:166px;display:flex;justify-content:center">
        <section id="sr" style="padding:0;flex:0 0 auto">
          <!-- isto kao .dm-ringbare > .dm-ring u PostBrisket.astro (desktop), proporcionalno umanjeno -->
          <div class="dm-ring" style="zoom:.56">
            <svg viewBox="0 0 264 264" aria-hidden="true">
              <defs>
                <linearGradient id="dmRingGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00AEEF"></stop><stop offset="1" stop-color="#8af2ff"></stop></linearGradient>
                <filter id="dmRingGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4.5" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
              </defs>
              <circle cx="132" cy="132" r="120" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="5"></circle>
              <circle id="arc" cx="132" cy="132" r="120" fill="none" stroke="url(#dmRingGrad)" stroke-width="5" stroke-linecap="round" filter="url(#dmRingGlow)"></circle>
              <circle id="dot" cx="252" cy="132" r="4.5" fill="#eafdff" filter="url(#dmRingGlow)"></circle>
            </svg>
            <div class="dm-ring__center">
              <span class="dm-ring__num"><span id="pnum">0</span><sup>%</sup></span>
              <span class="dm-ring__cap">Naručilo bi ponovo</span>
            </div>
          </div>
        </section>
        </div>
      </div>
    </div>
  </div>

  <!-- uputstvo za lokal: mesto za link sticker (sitni ispis iz pravila projekta), 600x110 px, 1383-1494 px od vrha -->
  <div id="linkhint" style="position:absolute;left:95.5px;width:239px;top:551px;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;
    font:700 8.5px/1 Inter;letter-spacing:.2em;text-transform:uppercase;color:#AEB4BD;opacity:.55;z-index:1;
    border:1.2px dashed rgba(244,246,248,.55);border-radius:11px">
    <span style="width:5px;height:5px;border-radius:50%;background:#00AEEF;box-shadow:0 0 6px rgba(0,174,239,.8)"></span>ovde nalepi link
  </div>

  <!-- varijanta 'reels' (Reels i feed, gde link ne može): traka sa adresom sajta na istom mestu -->
  <div id="sitebar" style="position:absolute;left:95.5px;width:239px;top:551px;height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;
    padding:0 6px 0 16px;background:var(--card,#141820);border:1.2px solid rgba(244,246,248,.16);border-radius:999px;z-index:1;opacity:0;
    box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 24px rgba(0,174,239,.18)">
    <span class="shm-logo" style="font-size:16.5px;white-space:nowrap">najbolje<b>u</b>beogradu<b>.</b>rs</span>
    <span style="display:grid;place-items:center;width:32px;height:32px;border-radius:999px;color:#fff;background:linear-gradient(180deg,#18b6ef 0%,#0089c6 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 4px 14px rgba(0,174,239,0.42)">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></span>
  </div>

  <img class="stk" id="st" src="" style="width:300px;left:65px;top:308px;transform-origin:50% 50%;opacity:0;z-index:5">

  <!-- KADAR 3 -->
  <div class="nb dm-root m-root slide" id="k3">
    <div class="safe">
      <h1 class="m-h1wrap" style="margin-top:24px"><span class="m-h1 split" style="letter-spacing:0.01em;text-align:center;transform:rotate(4deg);transform-origin:50% 50%"><span>oceni i <span class="hl">ti</span>!</span></span></h1>
    </div>
    <svg id="arrow" viewBox="0 0 70 108" style="position:absolute;left:189px;top:446px;width:52px;height:80px;overflow:visible;transform-origin:50% 0%;filter:drop-shadow(0 0 6px rgba(0,174,239,.9)) drop-shadow(0 0 16px rgba(0,174,239,.55))">
      <defs><linearGradient id="arrG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00AEEF"/><stop offset="1" stop-color="#8af2ff"/></linearGradient></defs>
      <path id="bolt" d="M44 0 L14 50 H34 L22 78 H8 L35 108 L62 78 H44 L58 44 H38 L56 0 Z" fill="url(#arrG)" stroke="#eafdff" stroke-width="1.5" stroke-linejoin="miter"/>
    </svg>
  </div>
</div>

<script>
/* ===================== ŠABLON: STORI ZA LOKALE (poziv na ocenjivanje) =====================
   Menja se SAMO ovaj blok + slika stikera. Sve ostalo (raspored, animacija, muzika, zvuk) ostaje.
   - pitanje: 4 reda, <br> između redova, &nbsp; da kratke reči ne ostanu same (npr. "u&nbsp;babalu?");
     ime lokala u <span class="hl">…</span> da bude plavo (boja sa sajta #00AEEF)
   - ocena / procenat: iz Supabase get_post_feedback(slug) -> ratings.score i returnVote.percent
   - stiker: PNG izrez jela sa belom ivicom (napravi-stiker.py), ime fajla u ovom folderu;
     veličina se sama prilagodi odnosu stranica slike (okviri BOX1 i BOX3), ništa se ne podešava ručno
   - varijanta: 'reels' (polje za link sticker) ili 'reels' (traka sa adresom sajta, za Reels i feed); isti raspored i zona; posle izmene obavezno: python3 proveri-zonu.py <repo>
   ========================================================================================== */
window.CONFIG = {
  pitanje:  'da li si probao<br>sendvič<br>rapsodija<br>u&nbsp;<span class="hl">babalu</span>?',
  ocena:    4.5,     // prosečna ocena gostiju (prikazuje se sa 1 decimalom, kao na sajtu)
  procenat: 83.3,    // % gostiju koji bi naručili ponovo (zaokružuje se, kao na sajtu)
  stiker:   '/sticker.png',
  pozadina: 'tamna',   // 'tamna' (osnovna, #0C0E12) · 'pink' (opcija 2, #B8005F)
  varijanta: 'stori'   // 'stori' = polje "ovde nalepi link" (za link sticker) · 'reels' = traka sa adresom sajta (Reels i feed)
};
document.getElementById('q1').innerHTML = CONFIG.pitanje;
document.getElementById('st').src = CONFIG.stiker;
if(CONFIG.pozadina==='pink') document.documentElement.classList.add('pz-pink');
</script>
<script>
// ---------- priprema: slova u <span> (svaka rec ostaje u jednom redu) ----------
function splitEl(root){
  const out=[];
  (function walk(node){
    [...node.childNodes].forEach(n=>{
      if(n.nodeType===3){
        const frag=document.createDocumentFragment();
        n.textContent.split(/( )/).forEach(tok=>{
          if(tok===' '){frag.appendChild(document.createTextNode(' '));return;}
          if(!tok)return;
          const w=document.createElement('span');w.className='w';
          [...tok].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c;w.appendChild(s);out.push(s);});
          frag.appendChild(w);
        });
        n.replaceWith(frag);
      } else if(n.nodeType===1 && n.tagName!=='BR') walk(n);
    });
  })(root);
  return out;
}
const groups={};
document.querySelectorAll('.split').forEach((el,i)=>groups[i]=splitEl(el));
// grupe: 0 = k1 naslov, 1 = k2 naslov, 2 = k2 logo, 3 = k3 naslov

const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=t=>{ // cubic-bezier(.22,.61,.36,1) - glavni easing sa sajta
  const x1=.22,y1=.61,x2=.36,y2=1; let u=t;
  for(let i=0;i<8;i++){const x=3*(1-u)**2*u*x1+3*(1-u)*u*u*x2+u**3-t;const dx=3*(1-u)**2*x1+6*(1-u)*u*(x2-x1)+3*u*u*(1-x2);if(Math.abs(dx)<1e-6)break;u-=x/dx;u=clamp(u);}
  return 3*(1-u)**2*u*y1+3*(1-u)*u*u*y2+u**3;
};
const cubicOut=t=>1-Math.pow(1-t,3);              // isto kao count-up na sajtu
const backOut=(t,s=1.35)=>1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2);
const p=(t,a,d)=>clamp((t-a)/d);

function letters(arr,t,start,stagger,dur){
  arr.forEach((c,i)=>{
    const k=ease(p(t,start+i*stagger,dur));
    c.style.opacity=k;
    c.style.filter=`blur(${(1-k)*10}px)`;
    c.style.transform=`translateY(${(1-k)*0.32}em) rotate(${(1-k)*9}deg)`;
  });
}
// slova: ulaz (blur + okret) i izlaz unazad (blur, bez okreta)
function letters(arr,t,start,stagger,dur,outStart){
  const n=arr.length;
  arr.forEach((c,i)=>{
    const k=ease(p(t,start+i*stagger,dur));
    const o=outStart==null?0:ease(p(t,outStart+(n-1-i)*0.012,0.34));
    const v=k*(1-o);
    c.style.opacity=v;
    c.style.filter=`blur(${(1-k)*10+o*8}px)`;
    c.style.transform=`translateY(${(1-k)*0.32-o*0.22}em) rotate(${(1-k)*9}deg)`;
  });
}
function block(el,t,tin,tout){
  const k=ease(p(t,tin,.45)), o=tout==null?0:ease(p(t,tout,.4));
  el.style.opacity=k*(1-o);
  el.style.filter=o>0?`blur(${o*8}px)`:'none';
  el.style.transform=`translateY(${(1-k)*16-o*10}px) scale(${1-o*.06})`;
}
const inOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

const R=120,C=2*Math.PI*R;
$('arc').setAttribute('stroke-dasharray',C);

// stanja stikera (css px): [left, top, width, rotacija]
// stiker se smešta u okvir [levo, gore, širina, visina] po svom stvarnom odnosu stranica (centrirano)
const BOX1=[65,322,300,214], BOX3=[65,200,300,226];
let S1,S2,S3,RAT=0.918;
const fit=(b,rot)=>{const w=Math.min(b[2],b[3]/RAT);return [b[0]+(b[2]-w)/2,b[1]+(b[3]-w*RAT)/2,w,rot];};
function geom(){
  const im=document.getElementById('st'); if(S1&&geom.ok)return; if(im.naturalWidth){RAT=im.naturalHeight/im.naturalWidth;geom.ok=1;}
  const _ph=document.getElementById('s2ph').getBoundingClientRect(), _sg=document.getElementById('stage').getBoundingClientRect();
  S1=fit(BOX1,-5); S3=fit(BOX3,4); S2=fit([_ph.left-_sg.left,_ph.top-_sg.top,_ph.width,_ph.height],5);
  im.style.left=S1[0]+'px'; im.style.top=S1[1]+'px'; im.style.width=S1[2]+'px';
}
const lerp=(a,b,k)=>a+(b-a)*k;
const T={k1out:3.3, mv1:3.45, k2:3.95, k2out:8.0, mv2:8.1, k3:8.45, end:12.4, total:13.0};

window.seek=function(t){
  geom();
  // pozadina blago ziva
  [[ '.g1',22,14,9.0,0.0],[ '.g2',18,22,11.0,1.7],[ '.g3',26,16,10.0,3.1],[ '.g4',30,24,7.5,0.9]].forEach(([s,ax,ay,per,ph])=>{
    const a=2*Math.PI*t/per+ph, el=document.querySelector(s);
    el.style.transform=`translate(${Math.sin(a)*ax}px,${Math.cos(a*0.8)*ay}px) scale(${1+Math.sin(a*1.3)*0.04})`;
    el.style.opacity=0.85+0.15*Math.sin(a*0.7+1);
  });
  const fo=ease(p(t,T.end,T.total-T.end));

  // KADAR 1 tekst
  letters(groups[0],t,0.12,0.022,0.55,T.k1out);

  // STIKER: ulaz sleva, pa S1 -> S2 -> S3
  { const a=1.35, k=p(t,a,0.85), b=backOut(k,1.1);
    const m1=inOut(p(t,T.mv1,0.95)), m2=inOut(p(t,T.mv2,0.95));
    let st=S1.map((v,i)=>lerp(v,S2[i],m1)); st=st.map((v,i)=>lerp(v,S3[i],m2));
    const [l,tp,w,rot]=st;
    const live=t>a+0.85?t-a-0.85:0, sway=Math.sin(live*2.2), br=Math.sin(live*3.1);
    // tokom preleta malo "plovi" (blagi luk)
    const arc1=Math.sin(Math.PI*m1)*-18, arc2=Math.sin(Math.PI*m2)*14;
    const sc=w/S1[2];
    const tx=(l+w/2)-(S1[0]+S1[2]/2), ty=(tp+w*RAT/2)-(S1[1]+S1[2]*RAT/2);   // centar slike
    const el=$('st');
    el.style.opacity=clamp(k*4)*(1-fo);
    el.style.transform=`translate(${tx+(1-b)*-470+arc2}px,${ty+arc1}px) scale(${sc*(1+(live?br*0.012:0))}) rotate(${rot+(1-b)*-28+(live?sway*1.6:0)}deg)`;
  }

  // KADAR 2: ocene ulaze ispod stikera i broje kao na sajtu, pa tekst
  { const a=T.k2;
    block($('rh'),t,a,T.k2out+0.15); block($('sr'),t,a+0.06,T.k2out+0.2);
    $('rnum').textContent=(cubicOut(p(t,a+0.1,1.1))*CONFIG.ocena).toFixed(1);
    const fr=CONFIG.procenat/100*cubicOut(p(t,a+0.1,2.0)), ang=2*Math.PI*fr;
    $('arc').setAttribute('stroke-dashoffset',C*(1-fr));
    const d=$('dot'); if(fr>0.015){d.style.display='';d.setAttribute('cx',132+R*Math.cos(ang));d.setAttribute('cy',132+R*Math.sin(ang));} else d.style.display='none';
    $('pnum').textContent=Math.round(CONFIG.procenat*cubicOut(p(t,a+0.1,2.0)));
    letters(groups[1],t,a+1.5,0.024,0.55,T.k2out);
    { // stiker sa logom: iskoči kad krene logo, diše (period 2 s), nestaje sa tekstom kadra 2
      const ls=a+1.5+groups[1].length*0.024-0.05, kin=p(t,ls,.45), bin=backOut(kin,1.7);
      const vis=clamp(kin*3)*(1-ease(p(t,T.k2out,.35)));
      const lb=t-ls-.45, br=lb>0?Math.sin(lb*Math.PI):0;
      const el=$('logostk'); el.style.opacity=vis;
      el.style.transform=`scale(${(0.6+0.4*bin)*(1+0.035*br)}) rotate(${(1-bin)*-6}deg)`; }
    letters(groups[2],t,a+1.5+groups[1].length*0.024+0.05,0.018,0.5,T.k2out);
  }

  // KADAR 3: tekst, stiker je vec narastao, strelica ka linku
  letters(groups[3],t,T.k3,0.04,0.55);
  { const ad=T.mv2+1.05;
    const kin=p(t,ad,.2), e=backOut(kin,2.2), ar=$('arrow');
    ar.style.opacity=t<ad?0:1;
    let jab=0, flash=0, shake=0;
    if(t>=9.5){ const lt=t-9.5, ph=(lt%0.5)/0.5;
      jab = ph<0.16 ? Math.sin(ph/0.16*Math.PI/2) : Math.pow(1-(ph-0.16)/0.84,2);   // udar nadole
      flash = ph<0.22 ? 1-ph/0.22 : 0;                                                  // blesak pri udaru
      shake = ph<0.3 ? Math.sin(lt*95)*(1-ph/0.3) : 0; }                               // drhtanje
    ar.style.transform=`translate(${shake*2.2}px,${(1-e)*-60+jab*6}px) scaleY(${clamp(e,0,1.06)*(1+jab*0.05)}) rotate(${shake*2.5}deg)`;
    ar.style.filter=`brightness(${1+flash*0.6}) drop-shadow(0 0 ${6+jab*10}px rgba(0,174,239,.95)) drop-shadow(0 0 ${16+jab*24}px rgba(0,174,239,${.55+jab*.4}))`;
  }
  // poslednjih 0,6 s: meko pretapanje u pozadinu
  $('k3').style.setProperty('opacity',String(1-fo),'important');
  const rl=CONFIG.varijanta==='reels', hk=ease(p(t,0.3,.5))*(1-fo);
  $('linkhint').style.opacity=rl?0:0.55*hk; $('sitebar').style.opacity=rl?hk:0;
};
window.TOTAL=T.total;
seek(0);
</script>
</body></html>
